name: ci

# Монорепозиторий: план и прототип лежат рядом с кодом, а сам код — в vela-app.
# GitHub Actions читает workflow только из корневого .github/workflows,
# поэтому все команды выполняются с working-directory: vela-app.
#
# Пайплайн из 00-conventions/05-testing.md, сокращённый до того, что реально
# существует в P1: линты, формат, типы, unit-тесты, архитектурные запреты и
# покрытие. Сборка бандла и e2e добавятся в ST-0101-04 по мере появления окна
# (T-0201).
#
# Linux-раннер выбран осознанно: vela-core, vela-ipc, vela-cron и весь UI
# собираются без Win32, значит быстрый фидбэк дешевле. Windows-джоба
# появится в P2, когда появятся поверхности.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Предупреждения clippy не должны копиться: они либо исправляются, либо
  # осознанно отключаются в Cargo.toml.
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vela-app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vela-app -> target

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets

      - name: test
        run: cargo test --workspace

      - name: arch-check
        run: bash scripts/arch-check.sh

  coverage:
    # D-17: покрытие должно измеряться, а не заявляться. На Windows-GNU
    # profiler runtime отсутствует, поэтому измеряем на Linux-раннере.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vela-app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vela-app -> target

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: coverage
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 60

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vela-app/ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: vela-app/ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: format
        run: pnpm format:check

      - name: test
        run: pnpm test

  ipc-contracts:
    # Отдельная джоба: контракты TS должны совпадать с Rust-типами.
    # Разъезд ловится здесь, а не в рантайме у пользователя.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vela-app/ui
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vela-app -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: vela-app/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: regenerate and compare
        run: pnpm ipc:check
