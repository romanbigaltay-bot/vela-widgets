[package]
name = "vela-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Платформенный слой: окна, WorkerW, захват, питание.
# Бизнес-логики здесь нет — только Win32 и его типизированные обёртки.
# win32-зависимость включается только на Windows, чтобы workspace собирался
# на любой ОС (см. README, «Отклонение от плана D-1»).
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
vela-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[lints]
workspace = true
