[package]
name = "vela-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Платформенный слой: окна, WorkerW, захват, питание.
# Бизнес-логики здесь нет — только Win32 и его типизированные обёртки.
# win32-зависимость включается только на Windows, чтобы workspace собирался
# на любой ОС (см. README, «Отклонение от плана D-1»).
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
vela-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Версия обязана совпадать с `windows` у Tauri 2.12: `HWND` одного крейта
# не приводится к `HWND` другого, и рассинхрон версий ломает сборку на
# границе «Tauri отдаёт хендл — платформенный слой его принимает».
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
] }

[lints]
workspace = true
