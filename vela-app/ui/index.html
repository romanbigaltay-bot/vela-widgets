<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Тема ставится до загрузки бандла, иначе первый кадр будет белым
         (ST-0103-02, AC-1). Инлайн-скрипт намеренно крошечный и без зависимостей. -->
    <meta name="color-scheme" content="dark light" />
    <title>Vela</title>
    <script>
      // Тема применяется до первого кадра. Режим (dark/light/system) хранится
      // отдельно от фактической темы: иначе data-theme="system" не совпадёт
      // ни с одним набором токенов. Позже источником станет SQLite через Rust.
      (function () {
        var root = document.documentElement;
        var mode = 'system';
        try {
          var saved = localStorage.getItem('vela.theme');
          if (saved === 'dark' || saved === 'light' || saved === 'system') {
            mode = saved;
          }
        } catch (e) {
          // localStorage недоступен (приватный режим) — остаёмся в системном.
        }

        var theme = mode;
        if (mode === 'system') {
          try {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (e2) {
            theme = 'dark';
          }
        }

        root.dataset.theme = theme;
        root.dataset.themeMode = mode;
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
