# Форматирование Rust. Значения согласованы с 00-conventions/08-code-style.md.
edition = "2021"
max_width = 100

# `use_small_heuristics = "Max"` намеренно НЕ включён: он схлопывает массивы и
# кортежи в одну строку до 100 символов, из-за чего константы вида FORBIDDEN
# и таблицы тестовых данных теряют построчную читаемость. По умолчанию rustfmt
# переносит их по элементу, и диффы в ревью читаются.

# Группировка импортов: std → внешние → крейты проекта.
# `imports_granularity` и `group_imports` — нестабильные опции rustfmt,
# они работают только на nightly. Оставлены закомментированными, чтобы
# `cargo fmt` не падал на stable и предупреждал явно, а не молча игнорировал.
# imports_granularity = "Crate"
# group_imports = "StdExternalCrate"