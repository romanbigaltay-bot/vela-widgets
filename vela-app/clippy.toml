# Точечные запреты Clippy, которых нет в стандартном наборе.
#
# `std::thread::sleep` в продакшн-коде почти всегда означает гонку, которую
# пытались «подождать». В тестах он допустим, но исключение должно быть видно
# в ревью — поэтому на месте вызова пишется `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
  { path = "std::thread::sleep", reason = "блокирующий sleep в UI/async-пути: используйте канал или tokio::time::sleep" },
]